<div class="container mt-5">
    <div>
        <h6>Backlog</h6>
    </div>
    <div class="row">
    @if(items; as items) {
        @for(item of items; track item.id) {
        <div class="card m-2 bg-light d-inline" (click)="showItemDetail(item)">
            <div class="card-body">
                <h6 class="card-title">{{ item.title }} 
                <span class="badge bg-info m-2">{{ item.type }}</span>
                <span class="badge bg-info m-2">{{ item.estimation }} pts.</span>
                </h6>
            </div>
        </div>
        }   
    }
    </div>

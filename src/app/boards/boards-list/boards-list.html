<div class="container mt-4">
    @if (userBoards; as userBoards) {
        @if (userBoards.length > 0) {
        <h5 class="mb-3 text-center fw-semibold">Your Boards</h5>
        <div class="list-group gap-2">
        @for (userBoard of userBoards; track userBoard.id) {
                <button type="button" class="list-group-item list-group-item-action rounded-3 border-0 shadow-sm p-3"
                (click)="showBoardDetails(userBoard.id)">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-light text-black d-flex align-items-center justify-content-center fw-bold flex-shrink-0">
                            {{ userBoard.name }}
                        </div>
                    </div>
                </button>
        }
        </div>
        } @else {
            <div class="m-5 text-center">No boards found.</div>
        }
    } @else {
        <p>Loading boards...</p>
    }
</div>

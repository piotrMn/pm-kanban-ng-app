<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">
      <span class="brand-mark">PM</span>
      Kanban
    </a>

    <div class="navbar-nav">
      <a class="nav-link"
         routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      @if (authService.isAuthenticated()) {
        <a class="nav-link" routerLink="/teams" routerLinkActive="active">Teams</a>
        <a class="nav-link" routerLink="/boards" routerLinkActive="active">Boards</a>
      }
    </div>

    <div class="navbar-nav ms-auto align-items-lg-center">
      @if (authService.isAuthenticated()) {
        <span class="user-greeting">
          Hi, {{ authService.getUserName() }}
        </span>
        <button class="logout-button" (click)="authService.logout()">Log out</button>
      } @else {
        <a class="nav-link" routerLink="/login">Log in</a>
        <a class="signup-button" routerLink="/signup">Sign up</a>
      }
    </div>
  </div>
</nav>
